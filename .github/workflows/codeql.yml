name: CodeQL

# Static analysis of the companion (Python) and of the workflows themselves (GitHub Actions).
# The addon (Lua) is not supported by CodeQL. Documentation-only changes do not trigger a scan.
on:
  push:
    branches: [main]
    paths-ignore:
      - wiki/**
      - docs/**
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - wiki/**
      - docs/**
      - "**.md"
  schedule:
    # Weekly scan, catches new CodeQL queries even without new commits
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the results to the "Security and quality" tab
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Python and Actions are analyzed from source, no build step needed
          build-mode: none
          # Broader set of queries (security + code quality)
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Also kept as a file: the results can be downloaded from the run (Artifacts) and
          # shared without giving access to the repository.
          output: codeql-results

      - name: Keep the results as a downloadable file
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 14
