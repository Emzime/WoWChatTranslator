name: Build WoWChatTranslatorCompagnion
# Title of each run in the Actions tab: tells a build from a release and from the wiki runs.
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Build - {0}', github.event.head_commit.message || github.event.pull_request.title || 'manual run') }}

# Documentation-only changes (wiki, README, screenshots) do not rebuild the companion: the
# "Publish wiki" workflow handles the wiki. Version tags always build (paths are not checked
# for tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - wiki/**
      - docs/**
      - "**.md"
      - .github/workflows/wiki.yml
      - .github/workflows/models.yml
      - .github/workflows/codeql.yml
      - .github/dependabot.yml
  pull_request:
    paths-ignore:
      - wiki/**
      - docs/**
      - "**.md"
      - .github/workflows/wiki.yml
      - .github/workflows/models.yml
      - .github/workflows/codeql.yml
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache converted models
        id: models
        uses: actions/cache@v5
        with:
          path: companion/models
          key: models-${{ hashFiles('companion/build/prepare_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Convert translation models (int8)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers[sentencepiece]"
          python build/prepare_models.py

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build/set_version.py ${{ github.ref_name }}

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Self-test from sources
        run: python main.py --selftest

      - name: Build executable
        shell: pwsh
        run: |
          python build/make_icon.py
          pyinstaller --noconfirm --distpath dist --workpath work build/WoWChatTranslatorCompagnion.spec
          # Folder shipped to players: the .exe alone. The translation model is downloaded
          # by the companion from the "models" release when the player chooses it.
          New-Item -ItemType Directory -Force dist\WoWChatTranslatorCompagnion | Out-Null
          Move-Item dist\WoWChatTranslatorCompagnion.exe dist\WoWChatTranslatorCompagnion\

      - name: Self-test of the executable
        shell: pwsh
        run: |
          # Tested with the Standard model next to it, as after a player's download; removed after.
          Copy-Item -Recurse models dist\WoWChatTranslatorCompagnion\models
          $p = Start-Process -FilePath dist\WoWChatTranslatorCompagnion\WoWChatTranslatorCompagnion.exe -ArgumentList "--selftest" -Wait -PassThru
          Remove-Item -Recurse -Force dist\WoWChatTranslatorCompagnion\models
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA\WoWChatTranslatorCompagnion\companion.log"; exit 1 }

      # The addon is also inside the .exe, which installs it; its own zip is for players who
      # only want the addon (manual install).
      - name: Package companion and addon
        shell: pwsh
        run: |
          Compress-Archive -Path dist\WoWChatTranslatorCompagnion -DestinationPath dist\WoWChatTranslatorCompagnion.zip
          Compress-Archive -Path ..\addon\WoWChatTranslator -DestinationPath dist\WoWChatTranslator-addon.zip

      - uses: actions/upload-artifact@v6
        with:
          name: WoWChatTranslatorCompagnion
          path: |
            companion/dist/WoWChatTranslatorCompagnion.zip
            companion/dist/WoWChatTranslator-addon.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            companion/dist/WoWChatTranslatorCompagnion.zip
            companion/dist/WoWChatTranslator-addon.zip

      # Only the 5 latest versions stay on the Releases page (the latest + 4 older). Older
      # releases are deleted, not their Git tags (the code of each version stays in Tags);
      # the "models" release (translation models) is never touched.
      - name: Remove old releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 5
        run: |
          gh release list --limit 200 --exclude-drafts --json tagName,createdAt \
            --jq '(env.KEEP | tonumber) as $keep | [.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release $tag (its tag is kept)"
            gh release delete "$tag" --yes
          done
